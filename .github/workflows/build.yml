# denpachan-asio-driver のビルド。
#
# - ASIO SDK: cmake/FetchAsioSdk.cmake が固定の URL と SHA256 で取る (ヘッダだけ使う)。取ったものはキャッシュする
# - 配布用の zip (DLL、licenses/、README.md) と PDB の zip を artifact にする (tools/package.ps1)
# - タグ vX.Y.Z (プレリリースは vX.Y.Z-rc.1 など) を push すると、同じビルドで GitHub Release を作る (release ジョブ)。
#   タグの版は CMakeLists.txt の project(... VERSION X.Y.Z) と合っていなければならない (README の「リリース」)
# - 手動: Actions の「Run workflow」でブランチを選んで実行できる
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # 版は CMakeLists.txt の project(... VERSION X.Y.Z) だけに書いてある。タグで動いたときは、タグが vX.Y.Z または
      # vX.Y.Z-ラベル の形で、X.Y.Z が CMakeLists.txt と同じかを先に確かめる (違えばビルドせずに失敗。リリースも作らない)
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(denpachan-asio-driver .*VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $label = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $m = [regex]::Match($env:GITHUB_REF_NAME, '^v(\d+\.\d+\.\d+)(?:-([0-9A-Za-z][0-9A-Za-z.]*))?$')
            if (-not $m.Success) { throw "tag '$env:GITHUB_REF_NAME' must be vX.Y.Z or vX.Y.Z-label (e.g. v1.2.0, v1.2.0-rc.1)" }
            if ($m.Groups[1].Value -ne $version) { throw "tag $env:GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)" }
            $label = $m.Groups[2].Value
          }
          "label=$label" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($label) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "version: $version$(if ($label) { "-$label" })"

      - name: Cache the ASIO SDK
        uses: actions/cache@v6
        with:
          path: out/deps
          key: deps-${{ hashFiles('cmake/FetchAsioSdk.cmake') }}

      - name: Build
        shell: pwsh
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: ./build.ps1 -VersionLabel "$env:LABEL"

      - name: Check the output
        shell: pwsh
        run: |
          $bin = 'out/build/bin/Release'
          foreach ($f in 'denpachan-asio-driver.dll', 'licenses/denpachan-asio-driver.txt', 'licenses/asiosdk.txt') {
            if (-not (Test-Path "$bin/$f")) { throw "missing: $f" }
          }
          # DLL が読み込めて、ABI の版を返すこと
          $sig = '[DllImport(@"' + (Resolve-Path "$bin/denpachan-asio-driver.dll").Path.Replace('\', '\\') + '")] public static extern int denpachan_asio_abi_version();'
          $type = Add-Type -MemberDefinition $sig -Name Abi -Namespace Denpachan -PassThru
          $abi = $type::denpachan_asio_abi_version()
          $expected = [int](Select-String -Path include/denpachan_asio.h -Pattern '#define DENPACHAN_ASIO_ABI_VERSION (\d+)').Matches[0].Groups[1].Value
          if ($abi -ne $expected) { throw "ABI version $abi (expected $expected)" }
          Write-Host "OK: ABI version $abi"

      # zip の名前: タグのときは denpachan-asio-driver-X.Y.Z[-ラベル]-win64.zip、それ以外は版の後ろにコミットの短いハッシュを付ける
      - name: Package
        id: package
        shell: pwsh
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { ./tools/package.ps1 -Suffix $env:LABEL } else { ./tools/package.ps1 }
          $zip = Get-ChildItem out/dist -Filter '*-win64.zip' | Select-Object -First 1
          $symbols = Get-ChildItem out/dist -Filter '*-win64-symbols.zip' | Select-Object -First 1
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "symbols=$($symbols.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.symbols }}
          archive: false

      - name: Hand over the release files
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.symbols }}
          retention-days: 1

  # タグのときだけ: GitHub Release を作り、配布用の zip と PDB の zip を付ける。ラベル付きのタグはプレリリースにする
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release-files

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "denpachan-asio-driver ${TAG#v}")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release-files/*.zip "${flags[@]}"
